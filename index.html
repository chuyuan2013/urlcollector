<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网址收藏</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav id="navbar">
            <div class="container">
                <h1 class="logo">网址收藏</h1>
                <div id="auth-buttons">
                    <button id="login-btn">登录</button>
                    <button id="register-btn">注册</button>
                </div>
                <div id="user-info" style="display: none;">
                    <span id="username"></span>
                    <button id="logout-btn">退出</button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="container">
            <!-- 登录表单 -->
            <div id="login-form" class="form-container" style="display: none;">
                <h2>登录</h2>
                <form id="login-form-element">
                    <div class="form-group">
                        <label for="login-email">邮箱</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn">登录</button>
                    <p class="error-message" id="login-error"></p>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="form-container" style="display: none;">
                <h2>注册</h2>
                <form id="register-form-element">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">邮箱</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn">注册</button>
                    <p class="error-message" id="register-error"></p>
                </form>
            </div>

            <!-- 网址管理区 -->
            <div id="url-manager" style="display: none;">
                <div class="header">
                    <h2>我的网址收藏</h2>
                    <button id="add-url-btn" class="btn">添加网址</button>
                </div>

                <!-- 添加/编辑网址表单 -->
                <div id="url-form" class="form-container" style="display: none;">
                    <h3>添加网址</h3>
                    <form id="url-form-element">
                        <input type="hidden" id="url-id">
                        <div class="form-group">
                            <label for="url-name">名称</label>
                            <input type="text" id="url-name" required>
                        </div>
                        <div class="form-group">
                            <label for="url-link">URL</label>
                            <input type="url" id="url-link" required>
                        </div>
                        <div class="form-group">
                            <label for="url-description">描述</label>
                            <textarea id="url-description"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="url-category">分类</label>
                            <input type="text" id="url-category" placeholder="例如：工作、学习、娱乐">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn">保存</button>
                            <button type="button" id="cancel-url-btn" class="btn secondary">取消</button>
                        </div>
                    </form>
                </div>

                <!-- 分类筛选 -->
                <div class="filter">
                    <input type="text" id="search-input" placeholder="搜索网址...">
                    <select id="category-filter">
                        <option value="">所有分类</option>
                    </select>
                </div>

                <!-- 网址列表 -->
                <div id="url-list">
                    <!-- 网址项将通过JavaScript动态添加 -->
                </div>
            </div>
        </main>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
